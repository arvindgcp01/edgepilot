# EdgePilot agent log rotation.
#
# Installed at /etc/newsyslog.d/edgepilot.conf, owned root:wheel, mode 0644.
#
# Rotation is newsyslog's job rather than the agent's, deliberately: it is the
# mechanism that rotates every other log on a Mac, an administrator configures it
# in one place, and an agent with its own retention policy would quietly disagree
# with that configuration.
#
# The `Z` flag makes newsyslog send SIGHUP after rotating, and the agent reopens
# its file on SIGHUP. Without that pairing the agent keeps writing to the renamed
# file and its logs disappear from the path an operator is tailing.
#
# columns: logfilename  [owner:group]  mode  count  size(KB)  when  flags
/var/log/edgepilot/agent.log        root:wheel  644  7  10240  *  JZ
/var/log/edgepilot/launchd.out.log  root:wheel  644  3   1024  *  J
/var/log/edgepilot/launchd.err.log  root:wheel  644  3   1024  *  J
