version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # AgentMessage/ServerMessage are envelopes for a single bidirectional stream,
    # not a request/response pair. Renaming them to ConnectRequest/ConnectResponse
    # would describe the RPC signature accurately and the protocol misleadingly.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
